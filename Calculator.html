<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="Calculator.css">
</head>
<body>
<div class="Abhay">
    <div class="main">
        <input type="text" id="display" readonly>
    </div>
    <div class="FirstRow">
        <button class="Ast"> C </button>
        <button class="Ast"> 1 </button>
        <button class="Ast"> 2 </button>
        <button class="Ast"> 3 </button>
    </div>
    <div class="SecondRow">
        <button class="Bnd"> - </button>
        <button class="Bnd"> 4 </button>
        <button class="Bnd"> 5 </button>
        <button class="Bnd"> 6 </button>
    </div>
    <div class="ThirdRow">
        <button class="Crd"> + </button>
        <button class="Crd"> 7 </button>
        <button class="Crd"> 8 </button>
        <button class="Crd"> 9 </button>
    </div>
    <div class="FourthRow">
       <button class="Dth"> / </button>
        <button class="Dth"> * </button>
        <button class="Dth"> = </button>
        <button class="Dth"> %</button>
    </div>
    <div class="FifthRow">
        <button class="Eth"> Enter </button>
        <button class="Eth"> Cancel </button>
    </div>
</div>
    <script src="Calculator.js"></script>
</body>
</html>
